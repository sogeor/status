# Gatus configuration of status.sogeor.com (deployed by sogeor/ansible, role status_vps).
# The page is public: endpoints hide hostnames, ports and URLs; server checks also hide errors.
# Secrets come from the environment of the service: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

web:
  address: 127.0.0.1
  port: 8080

storage:
  type: sqlite
  path: /data/data.db

ui:
  title: sogeor status
  description: Live status of Sogeor services.
  header: sogeor
  logo: /assets/logo.svg
  link: https://github.com/sogeor
  favicon:
    default: /assets/favicon.svg
    size16x16: /assets/favicon-16.png
    size32x32: /assets/favicon-32.png
  dashboard-heading: Service status
  dashboard-subheading: Checked every minute from an independent server.
  buttons:
    - name: GitHub
      link: https://github.com/sogeor
    - name: Report a security issue
      link: mailto:security@sogeor.com
  dark-mode: true
  default-sort-by: group
  # Brand palette (sogeor/brand colors.md) through the theme variables of the Gatus UI (HSL).
  # Gatus defines them on :root and :root.dark; these selectors are one step more specific.
  custom-css: |
    html:root {
      --background: 0 0% 100%; --foreground: 0 0% 0%;
      --card: 0 0% 100%; --card-foreground: 0 0% 0%;
      --muted-foreground: 0 0% 45%; --border: 0 0% 90%; --input: 0 0% 90%;
      --ring: 0 0% 45%; --radius: 0.5rem;
    }
    html:root.dark {
      --background: 0 0% 0%; --foreground: 0 0% 100%;
      --card: 0 0% 4%; --card-foreground: 0 0% 100%;
      --popover: 0 0% 4%; --popover-foreground: 0 0% 100%;
      --primary: 0 0% 100%; --primary-foreground: 0 0% 0%;
      --secondary: 0 0% 10%; --secondary-foreground: 0 0% 100%;
      --muted: 0 0% 10%; --muted-foreground: 0 0% 64%;
      --accent: 0 0% 10%; --accent-foreground: 0 0% 100%;
      --border: 0 0% 15%; --input: 0 0% 15%; --ring: 0 0% 64%;
    }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    a:hover { color: #e5261f; }
    /* The header subtitle is fixed in Gatus ("System Monitoring Dashboard"): show "status" instead */
    header h1 + p.text-sm { font-size: 0; }
    header h1 + p.text-sm::after { content: "status"; font-size: 0.875rem; }

alerting:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
    id: ${TELEGRAM_CHAT_ID}
    # api.telegram.org is blocked from the network of the status server; Cloudflare Worker proxy (sogeor/tofu dns)
    api-url: https://tg.sogeor.com
    client:
      timeout: 20s
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# Outages and maintenance: add an entry here through a pull request.
announcements: []

endpoints:
  # --- Infrastructure ---
  - name: odin · SSH
    group: Infrastructure
    url: tcp://odin.sogeor.com:822
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram
    ui: &private
      hide-hostname: true
      hide-port: true
      hide-url: true
      hide-errors: true
      hide-conditions: true

  - name: odin · ping
    group: Infrastructure
    url: icmp://odin.sogeor.com
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: telegram
    ui: *private

  # --- Website ---
  - name: sogeor.com
    group: Website
    url: https://sogeor.com
    interval: 5m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 301"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: telegram
    ui: &public
      hide-hostname: true
      hide-port: true
      hide-url: true

  - name: docs.sogeor.com
    group: Website
    url: https://docs.sogeor.com
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: telegram
    ui: *public

  - name: status.sogeor.com
    group: Website
    url: https://status.sogeor.com
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: telegram
    ui: *public

  # --- DNS & Email ---
  - name: DNS
    group: DNS & Email
    url: 1.1.1.1
    interval: 10m
    dns:
      query-name: sogeor.com
      query-type: NS
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: telegram
    ui: *public

  - name: Email routing
    group: DNS & Email
    url: 1.1.1.1
    interval: 1h
    dns:
      query-name: sogeor.com
      query-type: MX
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == pat(*mx.cloudflare.net*)"
    alerts:
      - type: telegram
    ui: *public
